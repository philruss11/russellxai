<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="An inbox sorted and drafted in your voice">
  <rect x="40" y="40" width="320" height="220" rx="14" fill="#FBF8F1" stroke="#e0d8c6" stroke-width="2"/>
  <rect x="40" y="40" width="320" height="38" rx="14" fill="#1E3D2F"/>
  <rect x="40" y="64" width="320" height="14" fill="#1E3D2F"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="13" fill="#F6F1E6">Inbox</text>
  <text x="332" y="64" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" fill="#cdbb7e">0 to do</text>
  <!-- sorted rows -->
  <g font-family="Segoe UI, sans-serif" font-size="10" fill="#6b6a5e">
    <rect x="60" y="96" width="280" height="34" rx="7" fill="#F6F1E6" stroke="#e0d8c6"/>
    <circle cx="78" cy="113" r="6" fill="#2E5A43"/><text x="94" y="110" fill="#1c1c19" font-size="11">New client request</text><text x="94" y="123">Drafted reply · ready to approve</text>
    <rect x="320" y="104" width="12" height="12" rx="3" fill="#9c7c2b"/>
    <rect x="60" y="138" width="280" height="34" rx="7" fill="#F6F1E6" stroke="#e0d8c6"/>
    <circle cx="78" cy="155" r="6" fill="#9c7c2b"/><text x="94" y="152" fill="#1c1c19" font-size="11">Invoice follow-up</text><text x="94" y="165">Sorted · scheduled</text>
    <rect x="60" y="180" width="280" height="34" rx="7" fill="#F6F1E6" stroke="#e0d8c6"/>
    <circle cx="78" cy="197" r="6" fill="#7f9a8a"/><text x="94" y="194" fill="#1c1c19" font-size="11">Newsletter</text><text x="94" y="207">Archived</text>
  </g>
  <!-- envelope badge -->
  <g transform="translate(286,196)">
    <rect x="0" y="0" width="58" height="44" rx="7" fill="#1E3D2F"/>
    <path d="M6 8 L29 26 L52 8" fill="none" stroke="#e7c97a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 38 L24 22 M52 38 L34 22" stroke="#cdbb7e" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
