<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RussellxAI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16171d"/>
      <stop offset="1" stop-color="#080809"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="12.25" fill="none" stroke="#ff2233" stroke-opacity="0.28"/>
  <!-- old-money seal ring -->
  <circle cx="32" cy="31" r="21" fill="none" stroke="#e7e3da" stroke-opacity="0.85" stroke-width="1.1"/>
  <circle cx="32" cy="31" r="18" fill="none" stroke="#e7e3da" stroke-opacity="0.3" stroke-width="0.8"/>
  <!-- top maker's mark -->
  <path d="M29 11.4 L32 8.2 L35 11.4 L32 14.6 Z" fill="#ff2233"/>
  <!-- serif monogram -->
  <text x="32" y="40.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" fill="#f3f0e8" letter-spacing="0">R</text>
  <!-- red accent x -->
  <text x="44.5" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#ff2233">x</text>
</svg>
