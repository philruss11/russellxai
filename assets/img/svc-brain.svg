<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A second brain rendered as a techy circuit diagram">
  <rect x="24" y="32" width="352" height="236" rx="16" fill="#0e0f14"/>
  <rect x="24" y="32" width="352" height="236" rx="16" fill="none" stroke="#2a2c34" stroke-width="2"/>
  <!-- faint grid -->
  <g stroke="#1c1e26" stroke-width="1">
    <line x1="24" y1="80" x2="376" y2="80"/><line x1="24" y1="128" x2="376" y2="128"/><line x1="24" y1="176" x2="376" y2="176"/><line x1="24" y1="224" x2="376" y2="224"/>
    <line x1="90" y1="32" x2="90" y2="268"/><line x1="160" y1="32" x2="160" y2="268"/><line x1="240" y1="32" x2="240" y2="268"/><line x1="310" y1="32" x2="310" y2="268"/>
  </g>
  <text x="200" y="56" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#ff4d5b" letter-spacing="3">SECOND BRAIN</text>
  <!-- central fissure -->
  <path d="M200 84 C196 120 204 150 200 200" fill="none" stroke="#3a3d47" stroke-width="1.2" stroke-dasharray="3 4"/>
  <!-- circuit traces (brain folds) -->
  <g fill="none" stroke="#ff2233" stroke-width="1.6" opacity="0.85" stroke-linecap="round">
    <path d="M150 120 H120 V150 H140"/>
    <path d="M170 140 H190 V165 H172"/>
    <path d="M250 120 H280 V150 H262"/>
    <path d="M230 140 H214 V165 H232"/>
    <path d="M160 100 V120 M240 100 V120"/>
  </g>
  <g stroke="#3a3d47" stroke-width="1.4">
    <line x1="120" y1="90" x2="160" y2="100"/><line x1="160" y1="100" x2="200" y2="84"/><line x1="200" y1="84" x2="240" y2="100"/><line x1="240" y1="100" x2="282" y2="92"/>
    <line x1="102" y1="120" x2="120" y2="90"/><line x1="282" y1="92" x2="300" y2="122"/>
    <line x1="100" y1="160" x2="115" y2="185"/><line x1="300" y1="160" x2="285" y2="185"/>
    <line x1="115" y1="185" x2="160" y2="205"/><line x1="160" y1="205" x2="200" y2="200"/><line x1="200" y1="200" x2="240" y2="205"/><line x1="240" y1="205" x2="285" y2="185"/>
  </g>
  <!-- nodes outlining the brain -->
  <g fill="#15161c" stroke="#3a3d47" stroke-width="1.4">
    <circle cx="120" cy="90" r="5"/><circle cx="160" cy="100" r="5"/><circle cx="240" cy="100" r="5"/><circle cx="282" cy="92" r="5"/>
    <circle cx="102" cy="120" r="5"/><circle cx="300" cy="122" r="5"/><circle cx="100" cy="160" r="5"/><circle cx="300" cy="160" r="5"/>
    <circle cx="115" cy="185" r="5"/><circle cx="285" cy="185" r="5"/><circle cx="160" cy="205" r="5"/><circle cx="240" cy="205" r="5"/>
  </g>
  <g fill="#1c1e26" stroke="#ff2233" stroke-width="1.5">
    <circle cx="200" cy="84" r="5"/><circle cx="120" cy="150" r="5"/><circle cx="280" cy="150" r="5"/><circle cx="190" cy="165" r="5"/><circle cx="214" cy="165" r="5"/><circle cx="200" cy="200" r="5"/>
  </g>
  <!-- glowing core -->
  <circle cx="200" cy="140" r="13" fill="#ff2233"/>
  <circle cx="200" cy="140" r="13" fill="none" stroke="#ff8089" stroke-width="2"/>
  <circle cx="200" cy="140" r="20" fill="none" stroke="#ff2233" stroke-width="1" opacity="0.4"/>
</svg>
