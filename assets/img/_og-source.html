<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .og{width:1200px;height:630px;position:relative;overflow:hidden;
    background:radial-gradient(120% 130% at 82% 0%,rgba(255,34,51,.22) 0%,#0a0a0d 46%,#060609 100%);
    font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#edeef2}
  .grid{position:absolute;inset:0;opacity:.16;
    background-image:linear-gradient(rgba(255,34,51,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,34,51,.5) 1px,transparent 1px);
    background-size:54px 54px;
    -webkit-mask-image:radial-gradient(ellipse 80% 90% at 78% 10%,#000,transparent 70%)}
  .glow{position:absolute;width:620px;height:620px;left:-140px;top:-180px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,34,51,.16),transparent 70%)}
  .wrap{position:absolute;inset:0;padding:78px 86px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .loc{font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:#ff4d5b;
    border:1px solid rgba(255,34,51,.5);background:rgba(255,34,51,.06);border-radius:999px;padding:11px 22px;display:inline-flex;align-items:center;gap:12px;align-self:flex-start}
  .loc .dot{width:11px;height:11px;border-radius:50%;background:#ff2233;display:inline-block;box-shadow:0 0 12px rgba(255,34,51,.8)}
  h1{font-size:76px;font-weight:800;line-height:1.02;margin:0;max-width:18ch;letter-spacing:-.03em;color:#fff}
  h1 .i{color:#ff2233;font-style:italic;text-shadow:0 0 34px rgba(255,34,51,.6)}
  .brand{font-size:40px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .brand .x{color:#ff2233;text-shadow:0 0 16px rgba(255,34,51,.7)}
  .row{display:flex;justify-content:space-between;align-items:flex-end}
  .tag{font-size:21px;color:#878a95;letter-spacing:.02em}
  .nodes{position:absolute;right:70px;top:150px}
</style></head>
<body>
<div class="og">
  <div class="grid"></div><div class="glow"></div>
  <svg class="nodes" width="320" height="300" viewBox="0 0 320 300">
    <g stroke="#ff2233" stroke-width="1.5" opacity=".7">
      <line x1="160" y1="150" x2="60" y2="80"/><line x1="160" y1="150" x2="270" y2="70"/>
      <line x1="160" y1="150" x2="48" y2="220"/><line x1="160" y1="150" x2="280" y2="225"/>
      <line x1="60" y1="80" x2="270" y2="70"/><line x1="48" y1="220" x2="280" y2="225"/>
    </g>
    <g fill="#1c1e26" stroke="#ff2233" stroke-width="1.6">
      <circle cx="60" cy="80" r="9"/><circle cx="270" cy="70" r="9"/><circle cx="48" cy="220" r="9"/><circle cx="280" cy="225" r="9"/>
    </g>
    <circle cx="160" cy="150" r="17" fill="#ff2233"/>
  </svg>
  <div class="wrap">
    <div class="row">
      <div class="brand">Russell<span class="x">x</span>AI</div>
      <div class="loc"><span class="dot"></span> Clarksville, Tennessee</div>
    </div>
    <h1>Real AI, set up <span class="i">inside</span> your business — and taught so it sticks.</h1>
    <div class="row">
      <div class="tag">AI Implementation &amp; Teaching &nbsp;·&nbsp; RussellxAI@gmail.com</div>
      <div class="tag">Phillip Russell</div>
    </div>
  </div>
</div>
</body></html>
