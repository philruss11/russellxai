<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A robot hand shaking a human hand">
  <rect x="24" y="36" width="352" height="228" rx="16" fill="#15161c" stroke="#2a2c34" stroke-width="2"/>
  <ellipse cx="200" cy="150" rx="78" ry="50" fill="#ff2233" opacity="0.14"/>

  <!-- HUMAN side (left): bright off-white -->
  <g>
    <path d="M40 246 L128 150 L160 176 L78 242 Q58 254 44 236 Z" fill="#30333d"/>
    <path d="M118 150 q48 -10 80 18 q10 8 7 20" fill="none" stroke="#e2e5eb" stroke-width="24" stroke-linecap="round"/>
    <path d="M154 126 q30 2 40 26" fill="none" stroke="#e2e5eb" stroke-width="15" stroke-linecap="round"/>
    <g stroke="#b7bcc7" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
      <line x1="184" y1="150" x2="189" y2="160"/><line x1="162" y1="146" x2="166" y2="156"/>
    </g>
  </g>

  <!-- ROBOT side (right): visible steel + red joints -->
  <g>
    <path d="M360 246 L272 150 L240 176 L322 242 Q342 254 356 236 Z" fill="#33363f"/>
    <g stroke="#5a5e6a" stroke-width="2"><line x1="296" y1="178" x2="332" y2="212"/><line x1="280" y1="190" x2="316" y2="224"/></g>
    <path d="M282 150 q-48 -10 -80 18 q-10 8 -7 20" fill="none" stroke="#5a5e6a" stroke-width="24" stroke-linecap="round"/>
    <path d="M282 150 q-48 -10 -80 18 q-10 8 -7 20" fill="none" stroke="#2a2d36" stroke-width="24" stroke-linecap="round" stroke-dasharray="2 15"/>
    <path d="M246 126 q-30 2 -40 26" fill="none" stroke="#5a5e6a" stroke-width="15" stroke-linecap="round"/>
    <g fill="#ff2233">
      <circle cx="250" cy="158" r="3.8"/><circle cx="226" cy="160" r="3.8"/><circle cx="210" cy="168" r="3.8"/><circle cx="230" cy="136" r="3.4"/>
    </g>
    <circle cx="292" cy="150" r="5" fill="#15161c" stroke="#ff2233" stroke-width="1.6"/>
  </g>

  <path d="M200 130 V178" stroke="#0e0f14" stroke-width="2" opacity="0.45"/>
  <text x="200" y="244" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#9a9ea8">You bring the idea. I build it.</text>
</svg>
