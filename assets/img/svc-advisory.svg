<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A drawing of a man in a suit, tie and glasses">
  <rect x="24" y="36" width="352" height="228" rx="16" fill="#15161c" stroke="#2a2c34" stroke-width="2"/>
  <ellipse cx="200" cy="150" rx="92" ry="64" fill="#ff2233" opacity="0.05"/>

  <!-- suit / shoulders -->
  <path d="M86 264 C86 212 132 196 168 192 L232 192 C268 196 314 212 314 264 Z" fill="#2a2d36"/>
  <!-- lapels -->
  <path d="M168 192 L200 250 L184 192 Z" fill="#1b1d24"/>
  <path d="M232 192 L200 250 L216 192 Z" fill="#1b1d24"/>
  <!-- shirt collar -->
  <path d="M180 192 L200 226 L220 192 Z" fill="#e7e3da"/>
  <!-- tie -->
  <path d="M194 198 L206 198 L210 200 L203 214 L210 256 L200 266 L190 256 L197 214 L190 200 Z" fill="#c0142a"/>
  <path d="M194 198 L206 198 L203 208 L197 208 Z" fill="#9e1023"/>
  <!-- neck -->
  <path d="M186 176 L214 176 L214 198 L200 206 L186 198 Z" fill="#c2ac90"/>
  <!-- ears -->
  <circle cx="150" cy="138" r="9" fill="#c2ac90"/><circle cx="250" cy="138" r="9" fill="#c2ac90"/>
  <!-- head -->
  <ellipse cx="200" cy="134" rx="52" ry="60" fill="#cbb79c"/>
  <!-- slick-back hair -->
  <path d="M150 138 C146 88 172 70 200 70 C228 70 254 88 250 138 C248 116 236 106 214 108 C228 98 226 92 226 92 C214 100 206 100 200 100 C194 100 186 100 174 92 C174 92 172 98 186 108 C164 106 152 116 150 138 Z" fill="#16181e"/>
  <g stroke="#2a2d36" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <path d="M168 86 C184 78 216 78 232 86"/>
    <path d="M162 98 C184 90 216 90 238 98"/>
  </g>
  <!-- eyebrows -->
  <path d="M165 120 q12 -5 26 0" fill="none" stroke="#3a3326" stroke-width="3" stroke-linecap="round"/>
  <path d="M209 120 q12 -5 26 0" fill="none" stroke="#3a3326" stroke-width="3" stroke-linecap="round"/>
  <!-- glasses -->
  <g fill="rgba(255,255,255,0.06)" stroke="#0e0f14" stroke-width="3.4">
    <rect x="161" y="126" width="34" height="27" rx="7"/>
    <rect x="205" y="126" width="34" height="27" rx="7"/>
  </g>
  <path d="M195 134 q5 -3 10 0" fill="none" stroke="#0e0f14" stroke-width="3.4"/>
  <line x1="161" y1="132" x2="150" y2="132" stroke="#0e0f14" stroke-width="3"/>
  <line x1="239" y1="132" x2="250" y2="132" stroke="#0e0f14" stroke-width="3"/>
  <!-- eyes -->
  <circle cx="178" cy="140" r="2.6" fill="#2a2620"/><circle cx="222" cy="140" r="2.6" fill="#2a2620"/>
  <!-- nose + mouth -->
  <path d="M200 150 l-5 14 q5 4 10 0" fill="none" stroke="#b09a7e" stroke-width="2" stroke-linecap="round"/>
  <path d="M186 176 q14 9 28 0" fill="none" stroke="#7d5f50" stroke-width="2.4" stroke-linecap="round"/>
</svg>
