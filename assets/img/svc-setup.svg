<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Set up in your own account and taught hands-on">
  <!-- monitor -->
  <rect x="48" y="48" width="252" height="160" rx="12" fill="#1E3D2F"/>
  <rect x="60" y="60" width="228" height="120" rx="6" fill="#FBF8F1"/>
  <rect x="140" y="208" width="68" height="14" fill="#1E3D2F"/>
  <rect x="112" y="222" width="124" height="10" rx="5" fill="#16291f"/>
