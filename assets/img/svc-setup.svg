  <text x="74" y="82" font-family="Segoe UI, sans-serif" font-size="9" fill="#6b6a5e">YOUR ACCOUNT · APPROVAL ON</text>
  <g stroke="#e0d8c6" stroke-width="2" stroke-linecap="round">
